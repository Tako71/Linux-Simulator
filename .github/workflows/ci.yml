name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Тесты курса
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Проверка целостности заданий
        run: python -m unittest discover -s tests -v

      - name: Синтаксис shell-скриптов
        run: |
          bash -n ltrain
          bash -n install-server.sh

  image:
    name: Сборка образа песочницы
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Вход в GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Имя образа в нижнем регистре
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Проверка, что песочница живая
        if: github.event_name != 'pull_request'
        run: |
          docker run -d --name probe --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /run/lock \
            ${{ steps.name.outputs.image }}:latest
          for i in $(seq 1 30); do
            state=$(docker exec probe systemctl is-system-running 2>&1 || true)
            case "$state" in
              running|degraded) echo "systemd поднялся: $state"; break ;;
            esac
            sleep 2
          done
          docker exec probe bash -lc 'command -v sshd ss lsof crontab tree >/dev/null && echo "утилиты на месте"'
          docker rm -f probe
